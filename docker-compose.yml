services:
  postgres:
    image: postgres:16-alpine
    container_name: qa-cement-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa
      POSTGRES_DB: qa_cement
    volumes:
      - qa_cement_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qa -d qa_cement']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qa_cement_pgdata:
